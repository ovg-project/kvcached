name: GPU CI Janitor

# Delete CI VMs that outlived their run, e.g. when a workflow was cancelled
# before its delete step. Each VM also deletes itself at its maximum run time.
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  delete-stale-vms:
    if: github.repository == 'ovg-project/kvcached'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete CI VMs older than six hours
        run: |
          gcloud compute instances list \
            --filter="labels.kvcached-ci=true AND creationTimestamp<-P6H" \
            --format="value(name,zone.basename())" |
          while read -r name zone; do
            echo "Deleting $name in $zone"
            gcloud compute instances delete "$name" --zone "$zone" --quiet
          done
