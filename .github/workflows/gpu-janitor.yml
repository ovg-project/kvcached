name: GPU CI Janitor

# Delete CI VMs that outlived their run, e.g. when a workflow was cancelled
# before its delete step. Each VM also deletes itself at its maximum run time.
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  delete-stale-vms:
    if: github.repository == 'ovg-project/kvcached'
    runs-on: ubuntu-latest
    steps:
      # The project, service account and provider are secrets, so that the
      # public logs show *** for them, gcloud's resource URLs included. The
      # project number inside the provider path can appear on its own too.
      - name: Mask the GCP project number
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          number=$(echo "$WIF_PROVIDER" | cut -d/ -f2)
          if [ -n "$number" ]; then
            echo "::add-mask::$number"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete CI VMs older than six hours
        run: |
          gcloud compute instances list \
            --filter="labels.kvcached-ci=true AND creationTimestamp<-P6H" \
            --format="value(name,zone.basename())" |
          while read -r name zone; do
            echo "Deleting $name in $zone"
            gcloud compute instances delete "$name" --zone "$zone" --quiet
          done
