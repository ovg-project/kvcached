name: GPU Correctness
# The profile in the run's title lets the next run find its predecessor.
run-name: GPU Correctness (${{ inputs.profile || (github.event.schedule == '0 12 * * 6' && 'weekly' || 'nightly') }})

# Correctness on real GPUs: kvcached against the native engines, on a GCP
# L4 VM created for the run and deleted afterwards. Nightly on one L4; weekly
# on two L4s with tensor parallelism. Never runs for pull requests; the GCP
# credentials can only be obtained from main. Every run comments its results
# on the issue in the GPU_CI_RESULTS_ISSUE variable and keeps the setup of its
# profile up to date in that issue's description.
on:
  schedule:
    - cron: '0 8 * * *'     # nightly
    - cron: '0 12 * * 6'    # weekly, Saturday
  workflow_dispatch:
    inputs:
      profile:
        description: Test profile in tests/e2e/matrix.py
        default: nightly
        type: choice
        options: [nightly, weekly, smoke]

permissions:
  actions: read
  contents: read
  id-token: write
  issues: write

concurrency:
  group: gpu-correctness
  cancel-in-progress: false

jobs:
  e2e:
    if: github.repository == 'ovg-project/kvcached'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      VM_NAME: kvcached-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PROFILE: ${{ inputs.profile || (github.event.schedule == '0 12 * * 6' && 'weekly' || 'nightly') }}
      GCE_IMAGE_FAMILY: ${{ vars.GCE_IMAGE_FAMILY }}
      GCE_IMAGE_PROJECT: ${{ vars.GCE_IMAGE_PROJECT }}
      RESULTS_ISSUE: ${{ vars.GPU_CI_RESULTS_ISSUE }}
    steps:
      - uses: actions/checkout@v4

      # The project, service account and provider are secrets, so that the
      # public logs show *** for them, gcloud's resource URLs included. The
      # project number inside the provider path can appear on its own too.
      - name: Mask the GCP project number
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          number=$(echo "$WIF_PROVIDER" | cut -d/ -f2)
          if [ -n "$number" ]; then
            echo "::add-mask::$number"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Create L4 VM
        id: vm
        run: |
          machine=g2-standard-8      # one L4
          if [ "$PROFILE" = weekly ]; then
            machine=g2-standard-24   # two L4s
          fi
          bash tools/ci/gcp/launch.sh "$VM_NAME" "$machine" "${{ vars.GCP_L4_ZONES }}" 2>&1 |
            tee launch.log

      - name: Run the e2e suite on the VM
        env:
          ZONE: ${{ steps.vm.outputs.zone }}
        run: bash tools/ci/gcp/remote.sh "$VM_NAME" "$ZONE" "$PROFILE" results

      - name: Add results to the job summary
        if: always()
        run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload results
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-${{ env.PROFILE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

      - name: Delete VM
        if: always() && steps.vm.outputs.zone != ''
        env:
          ZONE: ${{ steps.vm.outputs.zone }}
        run: gcloud compute instances delete "$VM_NAME" --zone "$ZONE" --quiet

      - name: Comment on the results issue
        if: always() && env.RESULTS_ISSUE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          VM_OUTCOME: ${{ steps.vm.outcome }}
        run: |
          # The latest finished run of this profile, as SHA:CONCLUSION.
          prev=$(gh run list --workflow gpu-correctness.yml --branch main --limit 50 \
            --json databaseId,headSha,displayTitle,status,conclusion \
            --jq ".[] | select(.status == \"completed\" and .databaseId != $GITHUB_RUN_ID
                    and .displayTitle == \"GPU Correctness ($PROFILE)\")
                  | \"\(.headSha):\(.conclusion)\"" | sed -n 1p)
          reason=""
          if [ "$VM_OUTCOME" != success ]; then
            reason=launch.log
          fi
          python3 tools/ci/report.py correctness --results results --profile "$PROFILE" \
            --run-url "$RUN_URL" --sha "$GITHUB_SHA" --subject "$(git log -1 --format=%s)" \
            --prev "$prev" --artifact-url "$ARTIFACT_URL" --reason-file "$reason" \
            --comment comment.md --section section.md
          gh issue comment "$RESULTS_ISSUE" --body-file comment.md
          # Keep this profile's setup in the description; a smoke run only comments.
          if [ -f section.md ] && [ "$PROFILE" != smoke ]; then
            gh issue view "$RESULTS_ISSUE" --json body --jq .body > body.md
            python3 tools/ci/report.py splice --body body.md --name "$PROFILE" \
              --section section.md --out new.md
            if ! cmp -s body.md new.md; then
              gh issue edit "$RESULTS_ISSUE" --body-file new.md
            fi
          fi
