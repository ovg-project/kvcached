name: GPU Tests

on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Test profile to run
        required: true
        default: core
        type: choice
        options:
          - core
          - engines
          - vllm
          - sglang
          - nixl
      model:
        description: Model used by the NIXL profile
        required: false
        default: Qwen/Qwen2.5-1.5B-Instruct
        type: string
      repeat:
        description: Repeat the selected profile to expose flaky failures
        required: true
        default: 1
        type: number
      devices:
        description: Physical GPU indices or UUIDs (one normally, two for NIXL)
        required: false
        type: string
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: gpu-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gpu:
    # A pull request picks its profile with a label. The specific labels are
    # checked before the plain `gpu-ci` one so that carrying both does not
    # silently downgrade the run to `core`.
    name: >-
      GPU ${{ github.event_name == 'schedule' && 'engines' || inputs.profile ||
      (contains(github.event.pull_request.labels.*.name, 'gpu-ci-nixl') && 'nixl') ||
      (contains(github.event.pull_request.labels.*.name, 'gpu-ci-engines') && 'engines') ||
      (contains(github.event.pull_request.labels.*.name, 'gpu-ci-sglang') && 'sglang') ||
      (contains(github.event.pull_request.labels.*.name, 'gpu-ci-vllm') && 'vllm') ||
      'core' }}
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          contains(github.event.pull_request.labels.*.name, 'gpu-ci') ||
          contains(github.event.pull_request.labels.*.name, 'gpu-ci-vllm') ||
          contains(github.event.pull_request.labels.*.name, 'gpu-ci-sglang') ||
          contains(github.event.pull_request.labels.*.name, 'gpu-ci-engines') ||
          contains(github.event.pull_request.labels.*.name, 'gpu-ci-nixl')
        )
      )
    runs-on: [self-hosted, linux, x64, gpu, kvcached]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run kvcached GPU test profile
        env:
          PYTHON: ${{ vars.KVCACHED_GPU_PYTHON || 'python' }}
          VLLM_PYTHON: ${{ vars.KVCACHED_VLLM_PYTHON || vars.KVCACHED_GPU_PYTHON || 'python' }}
          SGLANG_PYTHON: ${{ vars.KVCACHED_SGLANG_PYTHON || vars.KVCACHED_GPU_PYTHON || 'python' }}
          GPU_CI_PROFILE: >-
            ${{ github.event_name == 'schedule' && 'engines' || inputs.profile ||
            (contains(github.event.pull_request.labels.*.name, 'gpu-ci-nixl') && 'nixl') ||
            (contains(github.event.pull_request.labels.*.name, 'gpu-ci-engines') && 'engines') ||
            (contains(github.event.pull_request.labels.*.name, 'gpu-ci-sglang') && 'sglang') ||
            (contains(github.event.pull_request.labels.*.name, 'gpu-ci-vllm') && 'vllm') ||
            'core' }}
          GPU_CI_REPEAT: ${{ inputs.repeat || 1 }}
          # NIXL needs two devices. A manual run states them through the
          # `devices` input; the `gpu-ci-nixl` label has no such input, so it
          # falls back to a dedicated repository variable.
          KVCACHED_GPU_VISIBLE_DEVICES: >-
            ${{ inputs.devices ||
            (contains(github.event.pull_request.labels.*.name, 'gpu-ci-nixl') &&
            vars.KVCACHED_GPU_NIXL_DEVICES) ||
            vars.KVCACHED_GPU_VISIBLE_DEVICES }}
          GPU_CI_REQUIRE_IDLE: ${{ vars.KVCACHED_GPU_REQUIRE_IDLE || 1 }}
          GPU_CI_ARTIFACT_DIR: >-
            gpu-ci-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
          MODEL: ${{ inputs.model || 'Qwen/Qwen2.5-1.5B-Instruct' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash tools/run_gpu_ci.sh

      - name: Upload GPU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: gpu-ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
