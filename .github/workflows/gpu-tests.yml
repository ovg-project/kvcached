name: GPU Tests

on:
  schedule:
    # The slot is only a *chance* to run. The plan job below decides whether
    # enough has landed on the default branch since the last scheduled pass.
    - cron: '41 9 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Test profile to run
        required: true
        default: core
        type: choice
        options:
          - core
          - engines
          - vllm
          - sglang
          - nixl
          - all
      model:
        description: Override the model; blank uses each smoke test's default
        required: false
        type: string
      repeat:
        description: Repeat the selected profile to expose flaky failures
        required: true
        default: 1
        type: number
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: gpu-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    # Resolve the profile, the device selection, and whether to run at all.
    # Keeping this in one hosted job avoids repeating the same six-way
    # expression on the job name and on two environment variables, and it
    # gives the scheduled path somewhere to explain why it declined to run.
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      # Unconditional: the plan step is a script in this repository, and the
      # scheduled path additionally needs history to count merges.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the run plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DISPATCH_PROFILE: ${{ inputs.profile }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          MIN_MERGES: ${{ vars.KVCACHED_GPU_SCHEDULED_MIN_MERGES || 5 }}
        run: bash tools/resolve_gpu_ci_plan.sh

  gpu:
    name: GPU ${{ needs.plan.outputs.profile }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: [self-hosted, linux, x64, gpu, kvcached]
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run kvcached GPU test profile
        # Only per-run settings live here. PYTHON, the engine interpreters and
        # CUDA_VISIBLE_DEVICES describe the machine, so the runner's own .env
        # supplies them: repository variables never reach a workflow triggered
        # by a pull request from a fork, and that is the case this run is for.
        env:
          GPU_CI_PROFILE: ${{ needs.plan.outputs.profile }}
          GPU_CI_REPEAT: ${{ inputs.repeat || 1 }}
          GPU_CI_ARTIFACT_DIR: >-
            gpu-ci-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
          # Blank on purpose: run_engine_smoke.sh and run_vllm_nixl_pd_smoke.sh
          # each carry their own default, and they differ.
          MODEL: ${{ inputs.model }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash tools/run_gpu_ci.sh

      - name: Upload GPU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: gpu-ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
