name: GPU Tests

on:
  schedule:
    # The slot is only a *chance* to run. The plan job below decides whether
    # enough has landed on the default branch since the last scheduled pass.
    - cron: '41 9 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Test profile to run
        required: true
        default: core
        type: choice
        options:
          - core
          - engines
          - vllm
          - sglang
          - nixl
          - all
      model:
        description: Model used by the engine and NIXL profiles
        required: false
        default: Qwen/Qwen2.5-1.5B-Instruct
        type: string
      repeat:
        description: Repeat the selected profile to expose flaky failures
        required: true
        default: 1
        type: number
      devices:
        description: Physical GPU indices or UUIDs (one normally, two for nixl and all)
        required: false
        type: string
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: gpu-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    # Resolve the profile, the device selection, and whether to run at all.
    # Keeping this in one hosted job avoids repeating the same six-way
    # expression on the job name and on two environment variables, and it
    # gives the scheduled path somewhere to explain why it declined to run.
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      profile: ${{ steps.plan.outputs.profile }}
      devices: ${{ steps.plan.outputs.devices }}
    steps:
      - name: Check out history for the scheduled merge count
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the run plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DISPATCH_PROFILE: ${{ inputs.profile }}
          DISPATCH_DEVICES: ${{ inputs.devices }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          SAME_REPO: >-
            ${{ github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository }}
          SINGLE_DEVICES: ${{ vars.KVCACHED_GPU_VISIBLE_DEVICES }}
          DUAL_DEVICES: ${{ vars.KVCACHED_GPU_DUAL_DEVICES }}
          MIN_MERGES: ${{ vars.KVCACHED_GPU_SCHEDULED_MIN_MERGES || 5 }}
        run: |
          set -euo pipefail

          has_label() {
            case " ${LABELS} " in (*" $1 "*) return 0 ;; (*) return 1 ;; esac
          }

          profile=""
          case "${EVENT}" in
            schedule)
              profile=all
              ;;
            workflow_dispatch)
              profile="${DISPATCH_PROFILE:-core}"
              ;;
            pull_request)
              if [[ "${SAME_REPO}" != "true" ]]; then
                echo "fork pull request: the self-hosted runner is not used"
                echo "run=false" >>"${GITHUB_OUTPUT}"
                exit 0
              fi
              # Specific labels win over the plain gpu-ci one, so carrying
              # both does not silently downgrade the run to core.
              if   has_label gpu-ci-all;     then profile=all
              elif has_label gpu-ci-nixl;    then profile=nixl
              elif has_label gpu-ci-engines; then profile=engines
              elif has_label gpu-ci-sglang;  then profile=sglang
              elif has_label gpu-ci-vllm;    then profile=vllm
              elif has_label gpu-ci;         then profile=core
              else
                echo "no gpu-ci label on this pull request"
                echo "run=false" >>"${GITHUB_OUTPUT}"
                exit 0
              fi
              ;;
          esac

          # The scheduled slot is a budget, not an obligation: only spend the
          # GPU once enough pull requests have squash-merged since the last
          # successful scheduled pass.
          if [[ "${EVENT}" == "schedule" ]]; then
            last="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/gpu-tests.yml/runs?event=schedule&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty')"
            if [[ -z "${last}" ]] || ! git cat-file -e "${last}^{commit}" 2>/dev/null; then
              echo "no usable previous scheduled run; treating this slot as due"
              merged="${MIN_MERGES}"
            else
              merged="$(git rev-list --count "${last}..HEAD")"
            fi
            echo "${merged} commit(s) on the default branch since ${last:-the beginning}, threshold ${MIN_MERGES}"
            if (( merged < MIN_MERGES )); then
              echo "run=false" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          # nixl and all drive a two-GPU prefill/decode transfer.
          case "${profile}" in
            nixl|all) devices="${DISPATCH_DEVICES:-${DUAL_DEVICES}}" ;;
            *)        devices="${DISPATCH_DEVICES:-${SINGLE_DEVICES}}" ;;
          esac
          if [[ -z "${devices}" ]]; then
            echo "no GPU device selection is configured for profile ${profile}" >&2
            echo "set KVCACHED_GPU_VISIBLE_DEVICES, or KVCACHED_GPU_DUAL_DEVICES for nixl and all" >&2
            exit 1
          fi

          echo "profile=${profile}"
          echo "devices=${devices}"
          {
            echo "run=true"
            echo "profile=${profile}"
            echo "devices=${devices}"
          } >>"${GITHUB_OUTPUT}"

  gpu:
    name: GPU ${{ needs.plan.outputs.profile }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: [self-hosted, linux, x64, gpu, kvcached]
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run kvcached GPU test profile
        env:
          PYTHON: ${{ vars.KVCACHED_GPU_PYTHON || 'python' }}
          VLLM_PYTHON: ${{ vars.KVCACHED_VLLM_PYTHON || vars.KVCACHED_GPU_PYTHON || 'python' }}
          SGLANG_PYTHON: ${{ vars.KVCACHED_SGLANG_PYTHON || vars.KVCACHED_GPU_PYTHON || 'python' }}
          GPU_CI_PROFILE: ${{ needs.plan.outputs.profile }}
          GPU_CI_REPEAT: ${{ inputs.repeat || 1 }}
          KVCACHED_GPU_VISIBLE_DEVICES: ${{ needs.plan.outputs.devices }}
          GPU_CI_REQUIRE_IDLE: ${{ vars.KVCACHED_GPU_REQUIRE_IDLE || 1 }}
          GPU_CI_ARTIFACT_DIR: >-
            gpu-ci-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
          MODEL: ${{ inputs.model || 'Qwen/Qwen2.5-1.5B-Instruct' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash tools/run_gpu_ci.sh

      - name: Upload GPU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: gpu-ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
